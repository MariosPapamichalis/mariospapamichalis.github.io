published:
  - title: "Educational Intervention Can Rewire Village Social Networks"
    authors: "Marios Papamichalis, Laura Forastiere, Edoardo M. Airoldi, Nicholas A. Christakis"
    year: 2026
    venue: "Nature"
    status: "Accepted"
    featured: true
    abstract: >
      Using a two-stage randomized public-health intervention in 110 remote Honduran
      villages (8,331 individuals), we quantify how an informational intervention alters
      pre-existing sociocentric networks. In low-dosage villages, treated individuals tend
      to sever health-advice ties with untreated alters, while in high-dosage villages
      treated individuals increase both inbound and outbound ties. The intervention also
      affects friendship and financial ties, indicating multiplex spillovers, yet
      aggregate village-level structure changes only modestly.

