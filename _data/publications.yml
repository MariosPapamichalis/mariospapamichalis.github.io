working:
  - title: "Group Cooperation Diverges onto Durable Low versus High Paths: Public Goods Experiments in 134 Honduran Villages"
    authors: "Marios Papamichalis, Nicholas A. Christakis, Feng Fu"
    year: 2026
    abstract: >
      We report a large lab-in-the-field public-goods experiment with 2,591 participants
      across 134 Honduran villages. Contribution trajectories split early into two
      persistent regimes, low and high, with little subsequent convergence. Groups with an
      early majority of above-norm contributors are much more likely to end in the
      high-cooperation regime, and early high contributions by socially central individuals
      help steer groups onto that path and keep them on it.

  - title: "Latent Space Network Modelling with Hyperbolic and Spherical Geometries"
    authors: "Marios Papamichalis, Kathryn Turnbull, Simón Lunagómez, Edoardo M. Airoldi"
    year: 2026
    abstract: >
      We propose latent space network models in hyperbolic and spherical geometries to
      capture non-Euclidean structure in relational data. We address identifiability by
      characterizing which latent representations are recoverable from observed links and
      by imposing constraints that resolve non-identifiability. We develop Bayesian
      estimation procedures, both MCMC and variational, tailored to each geometry, and
      evaluate the models on real networks.

  - title: "Invariant Distributions on Riemannian Manifolds for Variational Autoencoders"
    authors: "Marios Papamichalis, Simón Lunagómez, Edoardo M. Airoldi, Regina Ruane"
    abstract: >
      A general framework for wrapped distributions on homogeneous Riemannian manifolds,
      built from area-preserving maps and isometries, together with radial compensation
      distributions that decouple curvature from parameter semantics in manifold-based
      generative models.

