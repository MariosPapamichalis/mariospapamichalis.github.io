review:
  - title: "Bayesian Predictive Synthesis for Dynamic Networks: Forecasting and Identifying Structural Mechanisms"
    authors: "Marios Papamichalis, Regina Ruane, Theofanis Papamichalis"
    year: 2026
    venue: "Journal of the American Statistical Association"
    status: "Under revision, 2nd R&R"
    featured: true
    abstract: >
      We combine competing generative models for dynamic networks through a predictive
      synthesis framework defined at the level of the graphon, so that forecasts are
      calibrated and the weights assigned to component models are interpretable as
      evidence for competing structural mechanisms of tie formation and dissolution.
    links:
      - label: "arXiv:2606.26136"
        url: "https://arxiv.org/abs/2606.26136"

  - title: "Clustering Network Formation in Populations of Networks"
    authors: "Marios Papamichalis, Nicholas A. Christakis, Laura Forastiere"
    year: 2026
    venue: "Annals of Applied Statistics"
    status: "Under revision, 1st R&R"
    featured: true
    abstract: >
      We study inference for populations of networks with different node sets and sizes,
      where subsets of networks may share distinct formation regimes. Each observed
      network is modeled as a noisy snapshot of an underlying network, and networks are
      clustered jointly by a strategic formation mechanism and a measurement-error
      profile. We build a likelihood from a single snapshot using a meeting-and-revision
      equilibrium, with a finite-horizon alternative, and develop parallelizable Bayesian
      inference via block-updated MCMC with exchange-type updates.

  - title: "Decision-Theoretic Robustness for Network Models"
    authors: "Marios Papamichalis, Regina Ruane, Swati Chandna, Simón Lunagómez"
    year: 2026
    venue: "Journal of Machine Learning Research"
    status: "Under revision"
    featured: true
    abstract: >
      We develop a decision-theoretic notion of robustness for Bayesian network analysis
      by allowing the posterior to vary within a small Kullback-Leibler neighborhood. For
      exchangeable graphs, we connect robust posterior risk to graphon limits, yielding
      tractable sensitivity expansions for losses based on network functionals. We propose
      a practical computation via exponential tilting of posterior draws and illustrate the
      approach on brain-connectivity and village-network data.

