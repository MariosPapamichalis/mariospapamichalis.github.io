---
layout: default
---
<article class="page">
  <header class="page-head">
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1 class="page-title">{{ page.title }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
</article>
