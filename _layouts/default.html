<!doctype html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.classList.remove('no-js');</script>
  {% include head.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <canvas id="backdrop" aria-hidden="true"></canvas>

  <div class="shell">
    {% include sidebar.html %}

    <main id="main" class="content">
      {{ content }}

      <footer class="footer">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}. Built with Jekyll, hosted on GitHub Pages.</p>
      </footer>
    </main>
  </div>

  <script src="{{ '/js/backdrop.js' | relative_url }}" defer></script>
</body>
</html>
